<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORLD ECHO | 世界回声 — 全球匿名声音与文字社区</title>
  <meta name="description" content="深夜静谧，听见世界另一端的心跳，留下穿越经纬的回声。高级极简、实时昼夜光影融合、治愈系全球匿名社区。">

  <!-- 引入 Google Fonts: Inter & Noto Sans SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- 引入 Three.js 与 Globe.gl CDN -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>

  <style>
    :root {
      /* 深夜静谧极简色彩规范 */
      --bg-space: #0B0F19;
      --bg-surface: rgba(17, 24, 39, 0.65);
      --bg-surface-hover: rgba(255, 255, 255, 0.06);
      --bg-card: rgba(18, 25, 42, 0.55);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --shadow-soft: 0 8px 32px 0 rgba(0, 0, 0, 0.28);
      
      /* 文字与层级 */
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      /* 静谧治愈辅助色系（低饱和度） */
      --accent-voice: #7DD3FC;      /* 柔和天青 */
      --accent-text: #94A3B8;       /* 霜灰银 */
      --accent-sun: #FDE68A;        /* 晨曦月白淡金 */
      --accent-danger: #F87171;     /* 哑光柔红 */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-space);
      color: var(--text-main);
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
      background-image: radial-gradient(circle at 50% 0%, rgba(30, 41, 59, 0.3) 0%, transparent 65%);
    }

    /* 细线 SVG 图标通用规范 */
    .icon {
      width: 16px;
      height: 16px;
      stroke-width: 1.6;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .icon-sm { width: 14px; height: 14px; stroke-width: 1.5; }
    .icon-lg { width: 18px; height: 18px; stroke-width: 1.6; }

    /* 顶部导航条（无缝毛玻璃） */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(11, 15, 25, 0.75);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-voice);
      transition: background 0.3s ease;
    }

    .brand-text h1 {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
    }

    .brand-text p {
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* 语言切换菜单 */
    .lang-select {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-select:hover, .lang-select:focus {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
      color: var(--text-main);
    }

    .user-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      padding: 0.35rem 0.9rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .user-pill:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
      color: var(--text-main);
    }

    /* 3D 地球视窗 */
    .globe-section {
      position: relative;
      width: 100%;
      height: 480px;
      overflow: hidden;
      background: radial-gradient(circle at center, #0F1626 0%, #0B0F19 85%);
      border-bottom: 1px solid var(--border-subtle);
    }

    #globe-container {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #globe-container:active {
      cursor: grabbing;
    }

    /* 太阳与昼夜天象浮动条 */
    .solar-weather-strip {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      right: 5.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      pointer-events: none;
      z-index: 10;
    }

    .solar-badge-capsule {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: auto;
      color: var(--text-muted);
    }

    .subsolar-coord {
      color: var(--accent-sun);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .day-night-toggle-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      pointer-events: auto;
    }

    .dn-pill {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-subtle);
      color: var(--text-dim);
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      backdrop-filter: blur(16px);
      font-family: inherit;
    }

    .dn-pill:hover {
      background: var(--bg-surface-hover);
      color: var(--text-muted);
    }

    .dn-pill.active {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
      color: var(--text-main);
    }

    .dn-count {
      opacity: 0.65;
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
    }

    /* 地球左下角图例胶囊 */
    .globe-legend-capsule {
      position: absolute;
      bottom: 1.25rem;
      left: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      box-shadow: var(--shadow-soft);
      pointer-events: auto;
      user-select: none;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend-dot.voice { background: var(--accent-voice); }
    .legend-dot.text { background: var(--accent-text); }
    .legend-dot.sun { background: var(--accent-sun); }

    .legend-divider {
      width: 1px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* 地球右侧悬浮整合式工具栏 */
    .globe-toolbar {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 0.25rem;
      box-shadow: var(--shadow-soft);
      z-index: 10;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .tool-divider {
      width: 16px;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 2px 0;
    }

    /* 主体容器（留白呼吸感） */
    .main-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 2rem;
    }

    @media (max-width: 1024px) {
      .globe-section { height: 380px; }
      .solar-weather-strip { left: 1rem; right: 4rem; top: 0.8rem; }
      .main-container {
        grid-template-columns: 1fr;
        padding: 1.5rem 1rem;
      }
    }

    /* 高级毛玻璃面板 */
    .glass-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 1.4rem;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.3s ease;
    }

    .glass-panel:hover {
      border-color: var(--border-hover);
    }

    .panel-header {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.02em;
    }

    .panel-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 400;
    }

    /* 世界情绪天气（静谧低饱和胶囊） */
    .mood-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .mood-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      padding: 0.3rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
      user-select: none;
    }

    .mood-chip:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    .mood-chip.active {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.28);
      color: var(--text-main);
    }

    .mood-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .mood-count {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    /* 回声发射台 */
    .composer-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      padding: 0.2rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.2rem;
    }

    .composer-tab {
      flex: 1;
      text-align: center;
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .composer-tab.active {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 0.45rem;
      font-weight: 400;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      color: var(--text-main);
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
    }

    textarea {
      resize: vertical;
      min-height: 96px;
    }

    .char-count {
      text-align: right;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
      font-variant-numeric: tabular-nums;
    }

    /* 录音机区域（治愈轻量微光） */
    .recorder-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 1.4rem 1rem;
      text-align: center;
      margin-bottom: 1.1rem;
    }

    .record-timer {
      font-size: 1.6rem;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      letter-spacing: 0.08em;
      margin: 0.4rem 0 0.8rem;
    }

    .record-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-record {
      background: rgba(185, 28, 28, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #FCA5A5;
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: inherit;
      transition: all 0.25s ease;
    }

    .btn-record:hover {
      background: rgba(185, 28, 28, 0.25);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .btn-record.recording {
      animation: record-breathe 2s infinite ease-in-out;
      background: rgba(185, 28, 28, 0.35);
    }

    @keyframes record-breathe {
      0%, 100% { border-color: rgba(239, 68, 68, 0.3); opacity: 0.85; }
      50% { border-color: rgba(239, 68, 68, 0.7); opacity: 1; }
    }

    .audio-preview {
      width: 100%;
      margin-top: 1rem;
      display: none;
      filter: invert(0.85) hue-rotate(180deg);
      opacity: 0.8;
    }

    /* 情绪选择矩阵 */
    .emotion-select-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      margin-bottom: 1.1rem;
    }

    .emotion-select-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.45rem 0.25rem;
      text-align: center;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
    }

    .emotion-select-item:hover {
      background: var(--bg-surface-hover);
      color: var(--text-muted);
    }

    .emotion-select-item.selected {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.24);
      color: var(--text-main);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-dim);
      cursor: pointer;
      margin-bottom: 1.2rem;
      user-select: none;
    }

    /* 极简按钮 */
    .btn-submit {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 右侧信息流导航条 */
    .stream-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
      background: var(--bg-surface);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
    }

    .stream-focus {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .btn-reset-country {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-reset-country:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .stream-filters {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: var(--text-muted);
      background: var(--bg-surface-hover);
    }

    .filter-btn.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-subtle);
      color: var(--text-main);
    }

    .filter-separator {
      width: 1px;
      height: 12px;
      background: rgba(255, 255, 255, 0.08);
      margin: 0 0.2rem;
    }

    /* 留言卡片（毛玻璃高级质感） */
    .echo-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .echo-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.35rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow-soft);
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .echo-card:hover {
      border-color: var(--border-hover);
      background: rgba(21, 30, 50, 0.6);
    }

    .echo-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .author-info {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .author-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .author-meta {
      display: flex;
      flex-direction: column;
    }

    .author-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .post-time {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .country-tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .solar-status-tag {
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-variant-numeric: tabular-nums;
    }

    .solar-status-tag.day {
      background: rgba(253, 230, 138, 0.08);
      border: 1px solid rgba(253, 230, 138, 0.2);
      color: #FDE68A;
    }

    .solar-status-tag.night {
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.16);
      color: #94A3B8;
    }

    .solar-status-tag.twilight {
      background: rgba(251, 146, 60, 0.08);
      border: 1px solid rgba(251, 146, 60, 0.2);
      color: #FDBA74;
    }

    .emotion-tag {
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid transparent;
    }

    .echo-card-content {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #E2E8F0;
      margin-bottom: 0.9rem;
      word-break: break-word;
      white-space: pre-wrap;
      font-weight: 300;
    }

    /* 声音播放条 */
    .voice-player-bar {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 0.9rem;
    }

    .btn-play-voice {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--accent-voice);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-play-voice:hover {
      background: rgba(255, 255, 255, 0.16);
      color: var(--text-main);
    }

    .voice-wave-container {
      flex: 1;
      height: 20px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .wave-bar {
      flex: 1;
      height: 25%;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 2px;
      transition: height 0.25s ease;
    }

    .voice-player-bar.playing .wave-bar {
      animation: wave-gentle 1.2s infinite alternate ease-in-out;
      background: var(--accent-voice);
      opacity: 0.8;
    }

    .voice-player-bar.playing .wave-bar:nth-child(2n) { animation-delay: 0.2s; }
    .voice-player-bar.playing .wave-bar:nth-child(3n) { animation-delay: 0.4s; }
    .voice-player-bar.playing .wave-bar:nth-child(4n) { animation-delay: 0.1s; }

    @keyframes wave-gentle {
      0% { height: 20%; }
      100% { height: 85%; }
    }

    .voice-duration {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .echo-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.75rem;
      margin-top: 0.5rem;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-action {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s ease;
    }

    .btn-action:hover {
      color: var(--text-muted);
    }

    .btn-action.liked {
      color: #F87171;
    }

    .btn-action.btn-del:hover {
      color: var(--accent-danger);
    }

    /* 模态弹窗 */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(11, 15, 25, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background: #111726;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .modal-header {
      padding: 1.1rem 1.35rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 1.35rem;
      overflow-y: auto;
      flex: 1;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .comment-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.7rem;
      font-size: 0.82rem;
    }

    .comment-item-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-dim);
      font-size: 0.72rem;
      margin-bottom: 0.35rem;
    }

    /* 轻量 Toast 提示 */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
      color: var(--text-main);
      padding: 0.55rem 1.25rem;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      z-index: 999;
      box-shadow: var(--shadow-soft);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <a href="/" class="brand">
      <div class="brand-mark">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      </div>
      <div class="brand-text">
        <h1 data-i18n="site_title">WORLD ECHO</h1>
        <p data-i18n="site_subtitle">世界回声 · 静谧之境</p>
      </div>
    </a>
    <div class="header-actions">
      <!-- 多语言选择器 -->
      <select id="lang-select" class="lang-select" title="Language">
        <option value="zh">简体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ru">Русский</option>
        <option value="ar">العربية</option>
      </select>

      <!-- 匿名身份按钮 -->
      <div class="user-pill" id="identity-btn">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="current-nickname-display">探索者</span>
        <span id="my-country-badge" style="opacity: 0.65; font-size: 0.72rem;">...</span>
      </div>
    </div>
  </header>

  <!-- 3D 地球视窗 -->
  <div class="globe-section">
    <div id="globe-container"></div>
    
    <!-- 实时太阳光照与昼夜天象浮动条 -->
    <div class="solar-weather-strip">
      <div class="solar-badge-capsule">
        <svg class="icon icon-sm" style="color: var(--accent-sun);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <span data-i18n="sun_subsolar">太阳直射</span>
        <span class="subsolar-coord" id="solar-subsolar-display">--</span>
      </div>

      <div class="day-night-toggle-group">
        <button class="dn-pill active" data-dn="all" id="dn-filter-all" data-i18n="filter_all_time">全球时空</button>
        <button class="dn-pill" data-dn="day" id="dn-filter-day">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <span data-i18n="filter_day_only">昼间之境</span>
          <span class="dn-count" id="day-country-count">0</span>
        </button>
        <button class="dn-pill" data-dn="night" id="dn-filter-night">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span data-i18n="filter_night_only">夜幕低垂</span>
          <span class="dn-count" id="night-country-count">0</span>
        </button>
      </div>
    </div>

    <!-- 地球左下角图例胶囊 -->
    <div class="globe-legend-capsule">
      <span class="legend-item"><span class="legend-dot voice"></span><span data-i18n="legend_voice">声音回声</span></span>
      <span class="legend-divider"></span>
      <span class="legend-item"><span class="legend-dot text"></span><span data-i18n="legend_text">文字信笺</span></span>
      <span class="legend-divider"></span>
      <span class="legend-item"><span class="legend-dot sun"></span><span data-i18n="legend_sun">晨昏光影</span></span>
    </div>

    <!-- 地球右侧整合式悬浮工具栏 -->
    <div class="globe-toolbar">
      <button class="tool-btn" id="btn-toggle-spin" title="自转切换">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <div class="tool-divider"></div>
      <button class="tool-btn" id="btn-focus-sun" title="聚焦太阳直射点">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
      <div class="tool-divider"></div>
      <button class="tool-btn" id="btn-reset-view" title="全球全景视角">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      </button>
    </div>
  </div>

  <!-- 主体工作区 -->
  <main class="main-container">
    
    <!-- 左侧：情绪天气 + 发射回声 -->
    <aside style="display: flex; flex-direction: column; gap: 1.5rem;">
      
      <!-- 世界情绪天气 -->
      <section class="glass-panel">
        <div class="panel-header">
          <span data-i18n="world_mood_title">世界情绪天气</span>
          <span class="panel-sub" id="mood-summary">...</span>
        </div>
        <div class="mood-grid" id="mood-container">
          <!-- 情绪胶囊由 JS 动态生成 -->
        </div>
      </section>

      <!-- 回声发射台 -->
      <section class="glass-panel">
        <div class="panel-header">
          <span data-i18n="composer_title">发射回声</span>
          <span class="panel-sub" id="composer-mode-badge" data-i18n="mode_voice">声音模式</span>
        </div>

        <div class="composer-switch">
          <div class="composer-tab active" data-type="voice" id="tab-voice">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            <span data-i18n="tab_voice">录制声音</span>
          </div>
          <div class="composer-tab" data-type="text" id="tab-text">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
            <span data-i18n="tab_text">抒写文字</span>
          </div>
        </div>

        <!-- 语音录制区 -->
        <div id="voice-composer-area">
          <div class="recorder-box">
            <div style="font-size: 0.75rem; color: var(--text-dim);" data-i18n="rec_limit">最长 60 秒原生立体声录制</div>
            <div class="record-timer" id="record-timer">00:00</div>
            <div class="record-actions">
              <button class="btn-record" id="btn-record-toggle">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>
                <span id="record-btn-text" data-i18n="btn_start_rec">开始录音</span>
              </button>
              <button class="tool-btn" id="btn-rerecord" style="display: none;" title="重录">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
              </button>
            </div>
            <audio id="local-audio-preview" class="audio-preview" controls></audio>
          </div>
          
          <div class="form-group">
            <input type="text" id="voice-caption-input" maxlength="200" placeholder="为这束回声附上一句话（可选）..." data-i18n-ph="voice_caption_placeholder">
          </div>
        </div>

        <!-- 文字录入区 -->
        <div id="text-composer-area" style="display: none;">
          <div class="form-group">
            <textarea id="text-content-input" maxlength="1000" placeholder="这一刻，你在世界哪处，经历着怎样的心境？" data-i18n-ph="text_placeholder"></textarea>
            <div class="char-count"><span id="text-char-count">0</span> / 1000</div>
          </div>
        </div>

        <!-- 情绪选择器 -->
        <div class="form-group">
          <label data-i18n="mood_label">此刻心境：</label>
          <div class="emotion-select-row" id="emotion-selector">
            <!-- 情绪标签由 JS 生成，使用静谧调色 -->
          </div>
        </div>

        <!-- 匿名选项 -->
        <label class="checkbox-row">
          <input type="checkbox" id="hide-country-checkbox" style="accent-color: var(--accent-voice);">
          <span data-i18n="hide_country">隐藏国家归属（标记为深空孤岛）</span>
        </label>

        <!-- 发送按钮 -->
        <button class="btn-submit" id="btn-submit-echo">
          <svg class="icon" viewBox="0 0 24 24"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span data-i18n="btn_submit_echo">发送回声</span>
        </button>
      </section>

    </aside>

    <!-- 右侧：全球回声流 -->
    <section>
      <!-- 过滤栏 -->
      <div class="stream-header">
        <div class="stream-focus">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          <span id="active-filter-label" data-i18n="stream_global">全球漫游</span>
          <button class="btn-reset-country" id="btn-clear-country" style="display: none;" data-i18n="btn_back_global">返回全球</button>
        </div>

        <div class="stream-filters">
          <button class="filter-btn active" data-type="all" data-i18n="filter_all">全部</button>
          <button class="filter-btn" data-type="voice" data-i18n="filter_voice">声音</button>
          <button class="filter-btn" data-type="text" data-i18n="filter_text">文字</button>
          <div class="filter-separator"></div>
          <button class="filter-btn active" data-sort="latest" data-i18n="sort_latest">最新</button>
          <button class="filter-btn" data-sort="popular" data-i18n="sort_popular">热门</button>
          <button class="filter-btn" data-sort="random" data-i18n="sort_random">漫游</button>
          <button class="tool-btn" id="btn-refresh-stream" style="width: 28px; height: 28px;" title="刷新">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          </button>
        </div>
      </div>

      <!-- 留言卡片列表 -->
      <div class="echo-list" id="echo-stream-container">
        <div class="empty-state" data-i18n="loading_stream">正在调频宇宙接收器...</div>
      </div>
    </section>

  </main>

  <!-- 模态框：匿名身份管理 / 恢复码 -->
  <div class="modal-backdrop" id="identity-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-size: 0.95rem; font-weight: 500;" data-i18n="modal_identity_title">匿名身份与凭据</h3>
        <button class="tool-btn" id="btn-close-identity">
          <svg class="icon" viewBox="0 0 24 24"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label data-i18n="nickname_label">你的匿名代号：</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="input-nickname" maxlength="30" placeholder="例如：星海漫游者 #42">
            <button class="btn-submit" id="btn-save-nickname" style="width: auto; padding: 0.4rem 1rem; font-size: 0.82rem;" data-i18n="btn_save">保存</button>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1.5rem;">
          <label data-i18n="recovery_code_label">身份恢复码（换设备/清缓存后恢复身份）：</label>
          <textarea id="identity-export-text" readonly style="font-family: monospace; font-size: 0.72rem; height: 70px; background: rgba(0,0,0,0.4);"></textarea>
          <button class="btn-submit" id="btn-copy-identity" style="margin-top: 0.4rem; background: rgba(255,255,255,0.05); color: var(--text-muted);" data-i18n="btn_copy_code">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            复制身份恢复码
          </button>
        </div>

        <div class="form-group" style="margin-top: 1.5rem; border-top: 1px solid var(--border-subtle); padding-top: 1.2rem;">
          <label data-i18n="import_code_label">导入恢复码恢复旧身份：</label>
          <textarea id="identity-import-text" placeholder="粘贴此前备份的恢复码..." style="font-family: monospace; font-size: 0.72rem; height: 60px;" data-i18n-ph="import_placeholder"></textarea>
          <button class="btn-submit" id="btn-import-identity" style="margin-top: 0.4rem;" data-i18n="btn_import">恢复该身份</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 模态框：评论回复 -->
  <div class="modal-backdrop" id="comment-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-size: 0.95rem; font-weight: 500;" data-i18n="modal_comment_title">留言回复</h3>
        <button class="tool-btn" id="btn-close-comments">
          <svg class="icon" viewBox="0 0 24 24"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="comment-original-quote" style="padding: 0.8rem; background: rgba(0,0,0,0.25); border-radius: var(--radius-sm); font-size: 0.82rem; margin-bottom: 1rem; color: var(--text-muted); border-left: 2px solid var(--border-subtle);">
          <!-- 原始留言摘要 -->
        </div>

        if (navLang.startsWith("zh")) savedLang = "zh";
        else if (navLang.startsWith("ja")) savedLang = "ja";
        else if (navLang.startsWith("ko")) savedLang = "ko";
        else if (navLang.startsWith("es")) savedLang = "es";
        else if (navLang.startsWith("fr")) savedLang = "fr";
        else if (navLang.startsWith("de")) savedLang = "de";
        else if (navLang.startsWith("ru")) savedLang = "ru";

    // ================= 实时天文太阳直射点演算 =================
    function calculateSubsolarPoint(date = new Date()) {
      const year = date.getUTCFullYear();
      const month = date.getUTCMonth();
      const day = date.getUTCDate();
      const hours = date.getUTCHours();
      const minutes = date.getUTCMinutes();
      const seconds = date.getUTCSeconds();

      const startOfYear = Date.UTC(year, 0, 1);
      const nowUTC = Date.UTC(year, month, day, hours, minutes, seconds);
      const dayOfYear = (nowUTC - startOfYear) / 86400000;

      // 太阳赤纬 (Solar Declination)
      const declination = -23.44 * Math.cos((2 * Math.PI / 365.25) * (dayOfYear + 10));

      // 太阳直射经度 (Subsolar Longitude)
      const utcHoursDec = hours + minutes / 60 + seconds / 3600;
      let sunLng = (12 - utcHoursDec) * 15;
      while (sunLng > 180) sunLng -= 360;
      while (sunLng < -180) sunLng += 360;

      return {
        lat: parseFloat(declination.toFixed(2)),
        lng: parseFloat(sunLng.toFixed(2)),
        utcDate: date
      };
    }

    function calculateCountrySolar(countryLat, countryLng, sunPos) {
      const toRad = Math.PI / 180;
      const phi1 = countryLat * toRad;
      const phi2 = sunPos.lat * toRad;
      const deltaLambda = (countryLng - sunPos.lng) * toRad;

      const sinAlt = Math.sin(phi1) * Math.sin(phi2) + Math.cos(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
      const altDeg = Math.asin(Math.max(-1, Math.min(1, sinAlt))) * (180 / Math.PI);

      const utcMin = sunPos.utcDate.getUTCHours() * 60 + sunPos.utcDate.getUTCMinutes();
      const localMin = Math.round((utcMin + (countryLng / 15) * 60 + 1440) % 1440);
      const hh = String(Math.floor(localMin / 60)).padStart(2, "0");
      const mm = String(localMin % 60).padStart(2, "0");
      const localTimeStr = `${hh}:${mm}`;

      let status = "night";
      let isDay = false;
      if (altDeg > 0) {
        status = "day";
        isDay = true;
      } else if (altDeg >= -6) {
        status = "twilight";
        isDay = true;
      }

      return {
        isDay,
        status,
        alt: altDeg.toFixed(1),
        localTimeStr,
      };
    }

    function refreshDiurnalStatus() {
      const sun = calculateSubsolarPoint(new Date());
      state.sunPosition = sun;
      
      let dayCount = 0;
      let nightCount = 0;

      Object.keys(COUNTRY_COORDINATES).forEach(cCode => {
        if (cCode === "UN") return;
        const coord = COUNTRY_COORDINATES[cCode];
        const res = calculateCountrySolar(coord.lat, coord.lng, sun);
        state.countryDayNightMap[cCode] = res;
        if (res.isDay) {
          dayCount++;
        } else {
          nightCount++;
        }
      });

      document.getElementById("day-country-count").textContent = dayCount;
      document.getElementById("night-country-count").textContent = nightCount;
      updateSolarInfoBar();
      updateSunDirectionShader();
    }

    function updateSolarInfoBar() {
      const sun = state.sunPosition;
      const latStr = sun.lat >= 0 ? `${Math.abs(sun.lat)}°N` : `${Math.abs(sun.lat)}°S`;
      const lngStr = sun.lng >= 0 ? `${Math.abs(sun.lng)}°E` : `${Math.abs(sun.lng)}°W`;
      document.getElementById("solar-subsolar-display").textContent = `${latStr}, ${lngStr}`;
    }

    function initIdentity() {

      if (!uid || !token) {
        uid = "usr_" + Math.random().toString(36).substring(2, 10) + Date.now().toString(36).slice(-4);
        token = Array.from(crypto.getRandomValues(new Uint8Array(16)))

        nick = t("user_default") + " #" + Math.floor(1000 + Math.random() * 9000);
        
        localStorage.setItem("we_user_id", uid);
        localStorage.setItem("we_token", token);
        localStorage.setItem("we_nickname", nick);
      }

      state.userId = uid;
      state.token = token;
      state.nickname = nick || t("user_default");
      document.getElementById("current-nickname-display").textContent = state.nickname;
    }

    async function updateNickname(newNick) {
      if (!newNick || !newNick.trim()) return;
      try {
        const res = await fetch("/api/echo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "update_nickname",
            user_id: state.userId,
            token: state.token,
            nickname: newNick.trim(),
          })
        });
        const d = await res.json();
        if (d.success) {
          state.nickname = d.nickname;
          localStorage.setItem("we_nickname", d.nickname);
          document.getElementById("current-nickname-display").textContent = d.nickname;
          showToast("代号已更新");
        } else {
          showToast(d.error || "更新失败");
        }
      } catch (e) {
        showToast("网络请求失败");
      }
    }

    // ================= 2. 3D 地球初始化与静谧着色器 =================
    function initGlobe() {
      const container = document.getElementById("globe-container");

      const textureLoader = new THREE.TextureLoader();
      const dayTexture = textureLoader.load("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg");
      const nightTexture = textureLoader.load("https://unpkg.com/three-globe/example/img/earth-night.jpg");

      // 绝美静谧昼夜 Shader：压暗对比度，呈现深夜深邃幽蓝与柔和微光
      const globeMaterial = new THREE.ShaderMaterial({
        uniforms: {
          dayTexture: { value: dayTexture },
          nightTexture: { value: nightTexture },
          uSunLat: { value: 0.0 },
          uSunLng: { value: 0.0 },
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D dayTexture;
          uniform sampler2D nightTexture;
          uniform float uSunLat;
          uniform float uSunLng;
          varying vec2 vUv;

          const float PI = 3.14159265359;

          void main() {
            float lng = (vUv.x - 0.5) * 2.0 * PI;
            float lat = (vUv.y - 0.5) * PI;

            // 球面绝对经纬度余弦点积运算
            float dotProd = sin(lat) * sin(uSunLat) + cos(lat) * cos(uSunLat) * cos(lng - uSunLng);

            // 柔和晨昏线过渡
            float t = smoothstep(-0.16, 0.16, dotProd);

            vec4 dayRaw = texture2D(dayTexture, vUv);
            vec4 nightRaw = texture2D(nightTexture, vUv);

            // 静谧治愈调色：将白天贴图稍微压暗降对比度，呈现柔和幽深的夜空深邃质感
            vec3 calmDay = dayRaw.rgb * vec3(0.72, 0.78, 0.86);

            // 柔和温暖的夜晚城市微光（不刺眼）
            vec3 calmNight = nightRaw.rgb * vec3(1.1, 1.05, 0.95);

            vec3 mixedColor = mix(calmNight, calmDay, t);

            // 晨昏交界处柔和的晚霞暮色（低饱和暖琥珀）
            float twilight = (1.0 - smoothstep(0.0, 0.16, abs(dotProd))) * 0.22;
            vec3 sunsetGlow = vec3(0.82, 0.55, 0.38) * twilight;

            gl_FragColor = vec4(mixedColor + sunsetGlow, 1.0);
          }
        `
      });

      state.globeMaterial = globeMaterial;

      const globe = Globe()(container)
        .globeMaterial(globeMaterial)
        .backgroundImageUrl("https://unpkg.com/three-globe@2.30.0/example/img/night-sky.png")
        .showAtmosphere(true)
        .atmosphereColor("#334155")
        .atmosphereAltitude(0.14)
        .pointOfView({ lat: 20, lng: 110, altitude: 2.2 });

      // 自转配置
      globe.controls().autoRotate = true;
      globe.controls().autoRotateSpeed = 0.45;

      let isSpinning = true;
      document.getElementById("btn-toggle-spin").addEventListener("click", () => {
        isSpinning = !isSpinning;
        globe.controls().autoRotate = isSpinning;
        showToast(isSpinning ? "已开启地球自转" : "已暂停自转");
      });

      document.getElementById("btn-focus-sun").addEventListener("click", () => {
        globe.pointOfView({ lat: state.sunPosition.lat, lng: state.sunPosition.lng, altitude: 1.8 }, 1200);
        showToast(`已对准太阳直射点: ${state.sunPosition.lat}°, ${state.sunPosition.lng}°`);
      });

      document.getElementById("btn-reset-view").addEventListener("click", () => {
        globe.pointOfView({ lat: 20, lng: 0, altitude: 2.4 }, 1000);
        state.filterCountry = "ALL";
        updateActiveCountryUI();
        loadEchoStream();
      });

      state.globe = globe;
      window.addEventListener("resize", () => {
        globe.width(container.clientWidth);
        globe.height(container.clientHeight);
      });

      updateSunDirectionShader();
    }

    function updateSunDirectionShader() {
      if (!state.globe || !state.globeMaterial) return;
      const sun = state.sunPosition;
      const deg2rad = Math.PI / 180.0;
      state.globeMaterial.uniforms.uSunLat.value = sun.lat * deg2rad;
      state.globeMaterial.uniforms.uSunLng.value = sun.lng * deg2rad;
    }

    // 渲染 3D 柱状光柱（柔和雅致、清晰可见）
    function updateGlobePoints(countryStats) {
      if (!state.globe) return;

      const pointsData = [];
      countryStats.forEach(item => {
        const cCode = item.country_code;
        const coord = COUNTRY_COORDINATES[cCode] || COUNTRY_COORDINATES["UN"];
        const total = item.total || 0;
        const voices = item.voices || 0;
        const diurnal = state.countryDayNightMap[cCode] || { isDay: true, status: "day", alt: "0", localTimeStr: "--:--" };
        
        const altitude = Math.min(0.08 + total * 0.04, 0.65);
        let color = voices > 0 ? "#7DD3FC" : "#94A3B8";

        pointsData.push({
          code: cCode,
          name: coord.name,
          lat: coord.lat,
          lng: coord.lng,
          total: total,
          voices: voices,
          altitude: altitude,
          color: color,
          diurnal: diurnal,
        });
      });

      state.globe
        .pointsData(pointsData)
        .pointAltitude("altitude")
        .pointColor("color")
        .pointRadius(1.3)
        .pointResolution(16)
        .pointLabel(d => `
          <div style="background: rgba(15,23,42,0.92); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(12px); padding: 8px 12px; border-radius: 8px; font-size: 12px; color: #F8FAFC; box-shadow: 0 8px 24px rgba(0,0,0,0.4);">
            <strong style="color: #F8FAFC;">${d.name} (${d.code})</strong><br/>
            <span style="color: #94A3B8;">${d.diurnal.isDay ? '日照之下' : '夜幕之下'} · ${d.diurnal.localTimeStr}</span><br/>
            <span style="color: #7DD3FC;">回声: ${d.total} (声音: ${d.voices})</span>
          </div>
        `)
        .onPointClick(d => {
          state.globe.pointOfView({ lat: d.lat, lng: d.lng, altitude: 1.6 }, 1000);
          state.filterCountry = d.code;
          updateActiveCountryUI();
          renderPosts(state.cachedPosts);
          showToast(`已漫游至 ${d.name}`);
        });
    }

    function updateActiveCountryUI() {
      const label = document.getElementById("active-filter-label");
      const btnClear = document.getElementById("btn-clear-country");
      if (state.filterCountry === "ALL") {
        label.textContent = t("stream_global");
        btnClear.style.display = "none";
      } else {
        const info = COUNTRY_COORDINATES[state.filterCountry] || { name: state.filterCountry };
        const diurnal = state.countryDayNightMap[state.filterCountry];
        const statusText = diurnal ? (diurnal.isDay ? "昼" : "夜") : "";
        label.textContent = `${info.name} · ${statusText}`;
        btnClear.style.display = "inline-block";
      }
    }

    // ================= 3. 麦克风录音控制 =================
    const btnRecordToggle = document.getElementById("btn-record-toggle");
    const recordBtnText = document.getElementById("record-btn-text");
    const recordTimer = document.getElementById("record-timer");
    const btnRerecord = document.getElementById("btn-rerecord");
    const localAudioPreview = document.getElementById("local-audio-preview");

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        let options = { mimeType: "audio/webm" };
        if (!MediaRecorder.isTypeSupported("audio/webm")) {
          options = MediaRecorder.isTypeSupported("audio/mp4") ? { mimeType: "audio/mp4" } : {};
        }

        const mediaRecorder = new MediaRecorder(stream, options);
        let audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
          state.recordingBlob = blob;
          const audioUrl = URL.createObjectURL(blob);
          localAudioPreview.src = audioUrl;
          localAudioPreview.style.display = "block";
          btnRerecord.style.display = "flex";
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        state.mediaRecorder = mediaRecorder;
        state.isRecording = true;
        state.recordingDuration = 0;
        btnRecordToggle.classList.add("recording");
        recordBtnText.textContent = t("btn_stop_rec");

        clearInterval(state.recordTimerInterval);
        state.recordTimerInterval = setInterval(() => {
          state.recordingDuration++;
          const mins = String(Math.floor(state.recordingDuration / 60)).padStart(2, "0");
          const secs = String(state.recordingDuration % 60).padStart(2, "0");
          recordTimer.textContent = `${mins}:${secs}`;

          if (state.recordingDuration >= 60) {
            stopRecording();
            showToast("已达最长 60 秒录制限额");
          }
        }, 1000);

      } catch (err) {
        showToast("无法访问麦克风，请检查权限");
      }
    }

    function stopRecording() {
      if (state.mediaRecorder && state.isRecording) {
        state.mediaRecorder.stop();
        state.isRecording = false;
        clearInterval(state.recordTimerInterval);
        btnRecordToggle.classList.remove("recording");
        recordBtnText.textContent = t("btn_rerecord");
      }
    }

    btnRecordToggle.addEventListener("click", () => {
      if (!state.isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    btnRerecord.addEventListener("click", () => {
      stopRecording();
      state.recordingBlob = null;
      state.recordingDuration = 0;
      localAudioPreview.style.display = "none";
      localAudioPreview.src = "";
      btnRerecord.style.display = "none";
      recordTimer.textContent = "00:00";
      recordBtnText.textContent = t("btn_start_rec");
      startRecording();
    });

    // ================= 4. 回声发射表单控制 =================
    const tabVoice = document.getElementById("tab-voice");
    const tabText = document.getElementById("tab-text");

    const textArea = document.getElementById("text-composer-area");
    const composerBadge = document.getElementById("composer-mode-badge");

      tabVoice.classList.add("active");

      voiceArea.style.display = "block";
      textArea.style.display = "none";
      composerBadge.textContent = t("mode_voice");

    tabText.addEventListener("click", () => {
      state.composerType = "text";
      tabText.classList.add("active");
      tabVoice.classList.remove("active");
      voiceArea.style.display = "none";
      textArea.style.display = "block";

    });

    const textInput = document.getElementById("text-content-input");
    const textCharCount = document.getElementById("text-char-count");
    textInput.addEventListener("input", () => {
      textCharCount.textContent = textInput.value.length;
    });

    const btnSubmit = document.getElementById("btn-submit-echo");
    btnSubmit.addEventListener("click", async () => {
      const hideCountry = document.getElementById("hide-country-checkbox").checked;
      const formData = new FormData();
      formData.append("action", "create");
      formData.append("user_id", state.userId);
      formData.append("token", state.token);
      formData.append("nickname", state.nickname);
      formData.append("content_type", state.composerType);
      formData.append("emotion", state.selectedEmotion);
      formData.append("hide_country", hideCountry ? "1" : "0");

      if (state.composerType === "voice") {
        if (!state.recordingBlob) {
          showToast("请先录制一段声音");
          return;
        }
        formData.append("file", state.recordingBlob, `voice_${Date.now()}.webm`);
        formData.append("duration", state.recordingDuration);
        formData.append("content", document.getElementById("voice-caption-input").value.trim());
      } else {
        const textVal = textInput.value.trim();
        if (!textVal) {
          showToast("请输入文字信笺内容");
          return;
        }
        formData.append("content", textVal);
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<span>${t("submitting")}</span>`;

      try {
        const res = await fetch("/api/echo", {
          method: "POST",
          body: formData,
        });
        const result = await res.json();
        if (result.success) {
          showToast("回声已送达世界");
          textInput.value = "";
          textCharCount.textContent = "0";
          document.getElementById("voice-caption-input").value = "";
          state.recordingBlob = null;
          state.recordingDuration = 0;
          localAudioPreview.style.display = "none";
          recordTimer.textContent = "00:00";
          btnRerecord.style.display = "none";
          recordBtnText.textContent = t("btn_start_rec");
          loadEchoStream();
        } else {
          showToast(result.error || "发送失败");
        }
      } catch (err) {
        showToast("网络请求异常");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `
          <svg class="icon" viewBox="0 0 24 24"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span>${t("btn_submit_echo")}</span>
        `;
      }
    });

    // ================= 5. 加载回声流与情绪天气 =================
    async function loadEchoStream() {
      const container = document.getElementById("echo-stream-container");
      
      const params = new URLSearchParams();
      if (state.filterCountry !== "ALL") params.append("country", state.filterCountry);
      if (state.filterType !== "all") params.append("type", state.filterType);
      if (state.filterEmotion !== "all") params.append("emotion", state.filterEmotion);
      params.append("sort", state.filterSort);
      params.append("limit", "50");

      try {
        const res = await fetch(`/api/echo?${params.toString()}`);
        const data = await res.json();

        if (!data.success) {
          container.innerHTML = `<div class="empty-state">${data.error}</div>`;
          return;
        }

        if (data.visitor_country) {
          state.visitorCountry = data.visitor_country;
          const diurnal = state.countryDayNightMap[data.visitor_country];
          const sunIcon = diurnal ? (diurnal.isDay ? "昼" : "夜") : "";
          document.getElementById("my-country-badge").textContent = `${data.visitor_country} · ${sunIcon}`;
        }

        state.cachedMoods = data.moods || [];
        state.cachedCountries = data.countries || [];
        state.cachedPosts = data.posts || [];

        renderMoodWeather(state.cachedMoods);

        if (data.countries) {
          updateGlobePoints(data.countries);
        }

        renderPosts(state.cachedPosts);

      } catch (err) {
        container.innerHTML = `<div class="empty-state">网络连接失败，请稍后重试</div>`;
      }
    }

    // 渲染世界情绪天气面板（低饱和静谧小圆点）
    function renderMoodWeather(moodList) {
      const container = document.getElementById("mood-container");
      const summaryEl = document.getElementById("mood-summary");
      container.innerHTML = "";

      let totalCount = 0;
      const moodCounts = {};
      (moodList || []).forEach(m => {
        moodCounts[m.emotion] = m.count;
        totalCount += m.count;
      });

      summaryEl.textContent = t("mood_summary", { count: totalCount });

      EMOTION_KEYS.forEach(key => {
        const item = EMOTION_MAP[key];
        const count = moodCounts[key] || 0;
        const chip = document.createElement("div");
        chip.className = `mood-chip ${state.filterEmotion === key ? "active" : ""}`;
        chip.innerHTML = `
          <span class="mood-dot" style="background: ${item.color};"></span>
          <span>${t("emotion_" + key)}</span>
          <span class="mood-count">${count}</span>
        `;
        chip.addEventListener("click", () => {
          if (state.filterEmotion === key) {
            state.filterEmotion = "all";
            chip.classList.remove("active");
          } else {
            state.filterEmotion = key;
          }
          loadEchoStream();
        });
        container.appendChild(chip);
      });
    }

    // 渲染卡片列表
    function renderPosts(posts) {
      const container = document.getElementById("echo-stream-container");
      
      let filtered = (posts || []).filter(post => {
        if (state.filterCountry !== "ALL" && post.country_code !== state.filterCountry) {
          return false;
        }
        if (state.filterDayNight === "day") {
          const dn = state.countryDayNightMap[post.country_code];
          return dn ? dn.isDay : true;
        } else if (state.filterDayNight === "night") {
          const dn = state.countryDayNightMap[post.country_code];
          return dn ? !dn.isDay : false;
        }
        return true;
      });

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">${t("empty_stream")}</div>`;
        return;
      }

      container.innerHTML = "";
      filtered.forEach(post => {
        const card = document.createElement("div");
        const isVoice = post.content_type === "voice";
        card.className = "echo-card";

        const countryInfo = COUNTRY_COORDINATES[post.country_code] || { name: post.country_code };
        const emotionData = EMOTION_MAP[post.emotion] || EMOTION_MAP["calm"];

        commentBtn.addEventListener("click", () => openCommentModal(post));

        const reportBtn = card.querySelector(".btn-report");
        reportBtn.addEventListener("click", () => openReportModal(post.id));

        if (isMyPost) {
          const delBtn = card.querySelector(".btn-del");
          delBtn.addEventListener("click", () => handleDeletePost(post.id));
        }

        container.appendChild(card);
      });
    }

    // ================= 6. 交互逻辑：播放、点赞、删除 =================
    function handlePlayAudio(url, btn, bar) {
      if (state.currentPlayingAudio) {
        state.currentPlayingAudio.audio.pause();
        state.currentPlayingAudio.btn.innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>`;
        state.currentPlayingAudio.bar.classList.remove("playing");
        if (state.currentPlayingAudio.url === url) {
          state.currentPlayingAudio = null;
          return;
        }
      }

      const audio = new Audio(url);
      btn.innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>`;
      bar.classList.add("playing");
      state.currentPlayingAudio = { audio, btn, bar, url };

      audio.play().catch(e => {
        showToast("音频加载失败");
        btn.innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>`;
        bar.classList.remove("playing");
      });

      audio.onended = () => {
        btn.innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>`;
        bar.classList.remove("playing");
        state.currentPlayingAudio = null;
      };
    }

    async function handleLikePost(postId, btn) {
      try {
        const res = await fetch("/api/echo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "like",
            user_id: state.userId,
            token: state.token,
            post_id: postId,
          })
        });
        const d = await res.json();
        if (d.success) {
          btn.querySelector(".like-num").textContent = d.likes_count;
          if (d.liked) {
            btn.classList.add("liked");
          } else {
            btn.classList.remove("liked");
          }
        }
      } catch (err) {
        showToast("点赞失败");
      }
    }

    async function handleDeletePost(postId) {
      if (!confirm("确定要永久销毁这条回声吗？若包含声音，将同步彻底清除。")) return;

      try {
        const res = await fetch(`/api/echo?id=${postId}&user_id=${state.userId}&token=${state.token}`, {
          method: "DELETE",
          headers: {
            "x-user-id": state.userId,
            "x-user-token": state.token,
          }
        });
        const d = await res.json();
        if (d.success) {
          showToast("回声已销毁");
          loadEchoStream();
        } else {
          showToast(d.error || "删除失败");
        }
      } catch (err) {
        showToast("网络请求异常");
      }
    }

    // ================= 7. 评论回复弹窗 =================
    const commentModal = document.getElementById("comment-modal");
    const commentInput = document.getElementById("comment-input");
    const btnSubmitComment = document.getElementById("btn-submit-comment");

    function openCommentModal(post) {
      state.commentingPostId = post.id;
      document.getElementById("comment-original-quote").textContent = 
        `"${(post.content || '声音回声').slice(0, 80)}..." — ${post.nickname}`;
      commentInput.value = "";
      commentModal.classList.add("active");
      loadComments(post.id);
    }

    document.getElementById("btn-close-comments").addEventListener("click", () => {
      commentModal.classList.remove("active");
    });

    async function loadComments(postId) {
      const container = document.getElementById("modal-comments-container");
      container.innerHTML = `<div style="text-align: center; color: var(--text-dim); font-size: 0.78rem; padding: 1rem;">接收回复中...</div>`;
      try {
        const res = await fetch(`/api/echo?post_id=${postId}`);
        const d = await res.json();
        if (d.success && d.comments && d.comments.length > 0) {
          container.innerHTML = d.comments.map(c => `
            <div class="comment-item">
              <div class="comment-item-header">
                <span style="color: var(--text-muted); font-weight: 500;">${escapeHTML(c.nickname)} (${c.country_code})</span>
                <span>${formatTimeAgo(c.created_at)}</span>
              </div>
              <div style="color: #E2E8F0;">${escapeHTML(c.content)}</div>
            </div>
          `).join("");
        } else {
          container.innerHTML = `<div style="text-align: center; color: var(--text-dim); font-size: 0.78rem; padding: 1rem;">${t("no_comments")}</div>`;
        }
      } catch (e) {
        container.innerHTML = `<div style="text-align: center; color: var(--accent-danger); font-size: 0.78rem; padding: 1rem;">加载回复失败</div>`;
      }
    }

    btnSubmitComment.addEventListener("click", async () => {
      const content = commentInput.value.trim();
      if (!content) return;
      btnSubmitComment.disabled = true;

      try {
        const res = await fetch("/api/echo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "comment",
            user_id: state.userId,
            token: state.token,
            nickname: state.nickname,
            post_id: state.commentingPostId,
            content: content,
          })
        });
        const d = await res.json();
        if (d.success) {
          commentInput.value = "";
          showToast("回复已送达");
          loadComments(state.commentingPostId);
          loadEchoStream();
        } else {
          showToast(d.error || "回复失败");
        }
      } catch (err) {
        showToast("回复网络故障");
      } finally {
        btnSubmitComment.disabled = false;
      }
    });

    // ================= 8. 举报弹窗 =================
    const reportModal = document.getElementById("report-modal");
    function openReportModal(postId) {
      state.reportingPostId = postId;
      reportModal.classList.add("active");
    }

    document.getElementById("btn-close-report").addEventListener("click", () => {
      reportModal.classList.remove("active");
    });

    document.getElementById("btn-confirm-report").addEventListener("click", async () => {
      const selectVal = document.getElementById("report-reason-select").value;
      const detailVal = document.getElementById("report-reason-detail").value.trim();
      const reason = detailVal ? `${selectVal}: ${detailVal}` : selectVal;

      try {
        const res = await fetch("/api/echo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "report",
            user_id: state.userId,
            token: state.token,
            post_id: state.reportingPostId,
            reason: reason,
          })
        });
        const d = await res.json();
        if (d.success) {
          showToast("已收到举报，系统将进行核验");
          reportModal.classList.remove("active");
        } else {
          showToast(d.error || "举报失败");
        }
      } catch (e) {
        showToast("提交失败");
      }
    });

    // ================= 9. 匿名凭据导入导出 =================
    const identityModal = document.getElementById("identity-modal");
    document.getElementById("identity-btn").addEventListener("click", () => {
      document.getElementById("input-nickname").value = state.nickname;
      const exportObj = { id: state.userId, token: state.token, nickname: state.nickname };
      document.getElementById("identity-export-text").value = btoa(JSON.stringify(exportObj));
      identityModal.classList.add("active");
    });

    document.getElementById("btn-close-identity").addEventListener("click", () => {
      identityModal.classList.remove("active");
    });

    document.getElementById("btn-save-nickname").addEventListener("click", () => {
      const val = document.getElementById("input-nickname").value.trim();
      updateNickname(val);
    });

    document.getElementById("btn-copy-identity").addEventListener("click", () => {
      const text = document.getElementById("identity-export-text").value;
      navigator.clipboard.writeText(text).then(() => {
        showToast("身份恢复码已复制");
      });
    });

    document.getElementById("btn-import-identity").addEventListener("click", () => {
      const text = document.getElementById("identity-import-text").value.trim();
      if (!text) return;
      try {
        const parsed = JSON.parse(atob(text));
        if (parsed.id && parsed.token) {
          localStorage.setItem("we_user_id", parsed.id);
          localStorage.setItem("we_token", parsed.token);
          localStorage.setItem("we_nickname", parsed.nickname || t("user_default"));
          showToast("身份已恢复，正在载入...");
          setTimeout(() => location.reload(), 1000);
        } else {
          showToast("凭据格式不正确");
        }
      } catch (err) {
        showToast("恢复码解析失败");
      }
    });

    // ================= 10. 筛选与监听 =================
    document.querySelectorAll(".filter-btn[data-type]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn[data-type]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.filterType = btn.dataset.type;
        loadEchoStream();
      });
    });

    document.querySelectorAll(".filter-btn[data-sort]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn[data-sort]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.filterSort = btn.dataset.sort;
        loadEchoStream();
      });
    });

    const dnAll = document.getElementById("dn-filter-all");
    const dnDay = document.getElementById("dn-filter-day");
    const dnNight = document.getElementById("dn-filter-night");

    dnAll.addEventListener("click", () => {
      state.filterDayNight = "all";
      dnAll.classList.add("active");
      dnDay.classList.remove("active");
      dnNight.classList.remove("active");
      renderPosts(state.cachedPosts);
    });

    dnDay.addEventListener("click", () => {
      state.filterDayNight = "day";
      dnDay.classList.add("active");
      dnAll.classList.remove("active");
      dnNight.classList.remove("active");
      renderPosts(state.cachedPosts);
    });

    dnNight.addEventListener("click", () => {
      state.filterDayNight = "night";
      dnNight.classList.add("active");
      dnAll.classList.remove("active");
      dnDay.classList.remove("active");
      renderPosts(state.cachedPosts);
    });

    document.getElementById("btn-clear-country").addEventListener("click", () => {
      state.filterCountry = "ALL";
      updateActiveCountryUI();
      if (state.globe) state.globe.pointOfView({ lat: 20, lng: 0, altitude: 2.4 }, 1000);
      renderPosts(state.cachedPosts);
    });

    document.getElementById("btn-refresh-stream").addEventListener("click", () => {
      refreshDiurnalStatus();
      updateSunDirectionShader();
      loadEchoStream();
      showToast("已刷新");
    });

    // 工具函数
    function escapeHTML(str) {
      if (!str) return "";
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    function formatTimeAgo(dateStr) {
      if (!dateStr) return t("just_now");
      const past = new Date(dateStr.endsWith("Z") ? dateStr : dateStr + "Z").getTime();
      const diffSecs = Math.max(0, Math.floor((Date.now() - past) / 1000));
      if (diffSecs < 60) return t("just_now");
      if (diffSecs < 3600) return `${Math.floor(diffSecs / 60)} ${t("mins_ago")}`;
      if (diffSecs < 86400) return `${Math.floor(diffSecs / 3600)} ${t("hours_ago")}`;
      return `${Math.floor(diffSecs / 86400)} ${t("days_ago")}`;
    }

    // 页面初始化
    window.addEventListener("DOMContentLoaded", () => {
      initLanguage();
      initIdentity();
      renderEmotionSelector();
      refreshDiurnalStatus();
      initGlobe();
      loadEchoStream();

      setInterval(() => {
        refreshDiurnalStatus();
        updateSunDirectionShader();
      }, 60000);
    });
  </script>
</body>
</html>
