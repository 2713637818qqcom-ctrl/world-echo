<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORLD ECHO | 管理后台与社区巡查</title>
  <style>
    :root {
      --bg-space: #060b16;
      --panel-bg: rgba(13, 22, 40, 0.9);
      --panel-border: rgba(64, 196, 255, 0.22);
      --cyan-voice: #00e5ff;
      --blue-text: #2979ff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ff5252;
      --warning: #ffb74d;
      --success: #00e676;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-space);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.25) 0%, transparent 60%);
    }

    header {
      background: rgba(6, 11, 22, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .badge-admin {
      background: rgba(255, 82, 82, 0.2);
      color: var(--danger);
      border: 1px solid rgba(255, 82, 82, 0.4);
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* 登录面板 */
    .login-box {
      max-width: 400px;
      margin: 6rem auto;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 2.2rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
    }

    .login-box p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: rgba(6, 11, 22, 0.8);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 0.75rem;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--cyan-voice);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00b0ff, #00e5ff);
      color: #060b16;
      width: 100%;
    }

    .btn-primary:hover {
      filter: brightness(1.15);
    }

    .btn-danger {
      background: rgba(255, 82, 82, 0.15);
      border: 1px solid rgba(255, 82, 82, 0.4);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .btn-success {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid rgba(0, 230, 118, 0.4);
      color: var(--success);
    }

    .btn-success:hover {
      background: var(--success);
      color: #060b16;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* 仪表盘统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
    }

    /* 选项卡导航 */
    .admin-tabs {
      display: flex;
      gap: 0.6rem;
      border-bottom: 1px solid var(--panel-border);
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
    }

    .admin-tab {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .admin-tab.active {
      background: rgba(0, 229, 255, 0.12);
      color: var(--cyan-voice);
      border: 1px solid rgba(0, 229, 255, 0.3);
    }

    /* 内容卡片列表 */
    .post-table {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .admin-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .admin-card.reported {
      border-left: 4px solid var(--danger);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .meta-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-body {
      background: rgba(6, 11, 22, 0.6);
      border-radius: 8px;
      padding: 0.8rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .card-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(13, 22, 40, 0.95);
      border: 1px solid var(--cyan-voice);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🌐 WORLD ECHO</span>
      <span class="badge-admin">管理中枢</span>
    </div>
    <div id="header-user-action" style="display: none;">
      <button class="btn btn-secondary" id="btn-logout" style="font-size: 0.8rem;">退出登录</button>
    </div>
  </header>

  <!-- 登录视窗 -->
  <div id="login-view" class="container">
    <div class="login-box">
      <h2>管理员登录</h2>
      <p>请输入在 Cloudflare Pages 中配置的 ADMIN_PASSWORD 密钥</p>
      <input type="password" id="admin-pass-input" placeholder="输入管理访问密码...">
      <button class="btn btn-primary" id="btn-login">确认登入</button>
    </div>
  </div>

  <!-- 管理工作区 -->
  <main id="dashboard-view" class="container" style="display: none;">
    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">总回声数量</span>
        <span class="stat-value" id="stat-total-posts">0</span>
      </div>
      <div class="stat-card" style="border-color: rgba(255, 82, 82, 0.4);">
        <span class="stat-label" style="color: var(--danger);">🚨 待审/被举报条目</span>
        <span class="stat-value" style="color: var(--danger);" id="stat-reported-posts">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">当前隐藏状态</span>
        <span class="stat-value" id="stat-hidden-posts">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">注册匿名身份</span>
        <span class="stat-value" id="stat-total-users">0</span>
      </div>
    </div>

    <!-- 标签页 -->
    <div class="admin-tabs">
      <div class="admin-tab active" data-tab="reported">🚨 违规举报处理 (<span id="tab-reported-count">0</span>)</div>
      <div class="admin-tab" data-tab="all">📋 全站留言审查</div>
    </div>

    <!-- 列表展示区 -->
    <div id="posts-container" class="post-table">
      <div style="text-align: center; color: var(--text-muted); padding: 2rem;">加载数据中...</div>
    </div>
  </main>

  <div class="toast" id="toast-el">提示</div>

  <script>
    let adminPassword = sessionStorage.getItem("we_admin_password") || "";
    let activeTab = "reported";

    function showToast(msg) {
      const toast = document.getElementById("toast-el");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    // 登录与鉴权初始化
    function checkAuth() {
      if (adminPassword) {
        document.getElementById("login-view").style.display = "none";
        document.getElementById("dashboard-view").style.display = "block";
        document.getElementById("header-user-action").style.display = "block";
        fetchAdminData();
      } else {
        document.getElementById("login-view").style.display = "block";
        document.getElementById("dashboard-view").style.display = "none";
        document.getElementById("header-user-action").style.display = "none";
      }
    }

    document.getElementById("btn-login").addEventListener("click", () => {
      const pass = document.getElementById("admin-pass-input").value.trim();
      if (!pass) return;
      adminPassword = pass;
      sessionStorage.setItem("we_admin_password", pass);
      checkAuth();
    });

    document.getElementById("btn-logout").addEventListener("click", () => {
      sessionStorage.removeItem("we_admin_password");
      adminPassword = "";
      location.reload();
    });

    // 标签页切换
    document.querySelectorAll(".admin-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".admin-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeTab = tab.dataset.tab;
        fetchAdminData();
      });
    });

    // 请求管理数据
    async function fetchAdminData() {
      const container = document.getElementById("posts-container");
      container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 2rem;">正在获取管理数据...</div>`;

      const params = new URLSearchParams();
      params.append("admin", "1");
      if (activeTab === "reported") {
        params.append("reported", "1");
      }
      params.append("limit", "50");

      try {
        const res = await fetch(`/api/echo?${params.toString()}`, {
          headers: { "x-admin-password": adminPassword }
        });
        const data = await res.json();

        if (!data.success) {
          if (res.status === 401) {
            showToast("密码错误，请重新登入");
            sessionStorage.removeItem("we_admin_password");
            adminPassword = "";
            checkAuth();
            return;
          }
          container.innerHTML = `<div style="text-align: center; color: var(--danger); padding: 2rem;">加载失败：${data.error}</div>`;
          return;
        }

        // 更新统计数据
        if (data.admin_stats) {
          document.getElementById("stat-total-posts").textContent = data.admin_stats.total_posts;
          document.getElementById("stat-reported-posts").textContent = data.admin_stats.reported_posts;
          document.getElementById("tab-reported-count").textContent = data.admin_stats.reported_posts;
          document.getElementById("stat-hidden-posts").textContent = data.admin_stats.hidden_posts;
          document.getElementById("stat-total-users").textContent = data.admin_stats.total_users;
        }

        renderAdminPosts(data.posts || []);
      } catch (err) {
        container.innerHTML = `<div style="text-align: center; color: var(--danger); padding: 2rem;">网络连接异常</div>`;
      }
    }

    function renderAdminPosts(posts) {
      const container = document.getElementById("posts-container");
      if (!posts || posts.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 2rem;">当前没有需要处理的条目，社区一切安好 🌈</div>`;
        return;
      }

      container.innerHTML = "";
      posts.forEach(post => {
        const card = document.createElement("div");
        const isReported = (post.reports_count || 0) > 0 || post.status === "hidden";
        card.className = `admin-card ${isReported ? "reported" : ""}`;

        let mediaDisplay = "";
        if (post.content_type === "voice" && post.media_url) {
          mediaDisplay = `
            <div style="margin: 0.5rem 0;">
              <audio controls src="${post.media_url}" style="width: 100%; height: 36px;"></audio>
              <div style="font-size: 0.72rem; color: var(--cyan-voice); margin-top: 0.3rem;">
                音频直链: <a href="${post.media_url}" target="_blank" style="color: inherit;">${post.media_key || 'media'}</a>
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-top">
            <div>
              <strong>#${post.id} ${escapeHTML(post.nickname)}</strong>
              <span class="meta-tag">国家: ${post.country_code}</span>
              <span class="meta-tag">类型: ${post.content_type}</span>
              <span class="meta-tag">情绪: ${post.emotion}</span>
              <span class="meta-tag" style="${post.status === 'hidden' ? 'color: var(--danger);' : ''}">状态: ${post.status}</span>
            </div>
            <div>
              <span class="meta-tag" style="color: ${post.reports_count > 0 ? 'var(--danger)' : 'var(--text-muted)'};">
                🚨 举报次数: ${post.reports_count || 0}
              </span>
              <span class="meta-tag">赞: ${post.likes_count || 0}</span>
            </div>
          </div>

          <div class="card-body">
            ${post.content ? `<div>${escapeHTML(post.content)}</div>` : ""}
            ${mediaDisplay}
            <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 0.5rem;">
              用户ID: ${post.user_id} | 发布时间: ${post.created_at}
            </div>
          </div>

          <div class="card-actions">
            ${post.status === "hidden" || post.reports_count > 0 ? `
              <button class="btn btn-success btn-restore" data-id="${post.id}">✅ 忽略举报 / 恢复公开</button>
            ` : ""}
            ${post.status === "published" ? `
              <button class="btn btn-secondary btn-hide" data-id="${post.id}">👁️ 设为隐藏</button>
            ` : ""}
            <button class="btn btn-danger btn-dual-delete" data-id="${post.id}">
              🗑️ 彻底双端删除（清理 GitHub + D1）
            </button>
          </div>
        `;

        // 按钮事件绑定
        const btnRestore = card.querySelector(".btn-restore");
        if (btnRestore) {
          btnRestore.addEventListener("click", () => updatePostStatus(post.id, "published", true));
        }

        const btnHide = card.querySelector(".btn-hide");
        if (btnHide) {
          btnHide.addEventListener("click", () => updatePostStatus(post.id, "hidden", false));
        }

        const btnDel = card.querySelector(".btn-dual-delete");
        if (btnDel) {
          btnDel.addEventListener("click", () => dualDeletePost(post.id));
        }

        container.appendChild(card);
      });
    }

    async function updatePostStatus(postId, status, resetReports) {
      try {
        const res = await fetch("/api/echo", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": adminPassword,
          },
          body: JSON.stringify({
            action: "admin_update_status",
            post_id: postId,
            status: status,
            reset_reports: resetReports,
          })
        });
        const d = await res.json();
        if (d.success) {
          showToast(`已成功将 #${postId} 设为 ${status}`);
          fetchAdminData();
        } else {
          showToast(d.error || "操作失败");
        }
      } catch (e) {
        showToast("请求失败");
      }
    }

    async function dualDeletePost(postId) {
      if (!confirm(`确定彻底双端销毁 #${postId}？\n若包含语音，将调用 GitHub API 物理删除音频文件，并彻底清理 D1 数据库记录。`)) {
        return;
      }

      try {
        const res = await fetch(`/api/echo?id=${postId}`, {
          method: "DELETE",
          headers: { "x-admin-password": adminPassword }
        });
        const d = await res.json();
        if (d.success) {
          showToast("已成功执行双端彻底删除");
          fetchAdminData();
        } else {
          showToast(d.error || "删除失败");
        }
      } catch (e) {
        showToast("网络请求异常");
      }
    }

    function escapeHTML(str) {
      if (!str) return "";
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.addEventListener("DOMContentLoaded", checkAuth);
  </script>
</body>
</html>
