<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORLD ECHO | 管理中枢与社区巡查</title>

  <!-- Google Fonts: Inter & Noto Sans SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Inline SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230B0F19' stroke='%237DD3FC' stroke-width='3'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%2394A3B8' stroke-width='1.5' stroke-dasharray='8 4'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%23FDE68A'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg-space: #0B0F19;
      --bg-surface: rgba(17, 24, 39, 0.65);
      --bg-surface-hover: rgba(255, 255, 255, 0.06);
      --bg-card: rgba(18, 25, 42, 0.55);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --shadow-soft: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --accent-voice: #7DD3FC;
      --accent-danger: #F87171;
      --danger-bg: rgba(185, 28, 28, 0.15);
      --danger-border: rgba(248, 113, 113, 0.35);
      --success-bg: rgba(34, 120, 74, 0.15);
      --success-border: rgba(74, 222, 128, 0.35);
      --success-text: #4ADE80;
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-border: rgba(255, 255, 255, 0.15);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-space);
      color: var(--text-main);
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.18) 0%, rgba(11, 15, 25, 0.95) 75%);
      background-attachment: fixed;
      line-height: 1.6;
    }

    /* 顶栏导航 */
    header {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #fff;
    }

    .brand svg {
      color: var(--accent-voice);
    }

    .badge-admin {
      background: rgba(248, 113, 113, 0.12);
      color: var(--accent-danger);
      border: 1px solid rgba(248, 113, 113, 0.3);
      font-size: 0.72rem;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 500;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* 登录面板 */
    .login-box {
      max-width: 420px;
      margin: 6rem auto;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.4rem;
      box-shadow: var(--shadow-soft);
      text-align: center;
    }

    .login-icon-wrap {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      background: rgba(125, 211, 252, 0.1);
      border: 1px solid rgba(125, 211, 252, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-voice);
    }

    .login-box h2 {
      margin-bottom: 0.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .login-box p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1.6rem;
      line-height: 1.5;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--accent-voice);
      box-shadow: 0 0 12px rgba(125, 211, 252, 0.18);
    }

    /* 按钮基础风格 */
    .btn {
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      font-family: inherit;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-main);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: var(--border-hover);
    }

    .btn-primary {
      background: rgba(125, 211, 252, 0.15);
      border: 1px solid rgba(125, 211, 252, 0.35);
      color: var(--text-main);
      width: 100%;
    }

    .btn-primary:hover {
      background: rgba(125, 211, 252, 0.25);
      border-color: rgba(125, 211, 252, 0.55);
    }

    .btn-danger {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--accent-danger);
    }

    .btn-danger:hover {
      background: rgba(185, 28, 28, 0.28);
      border-color: rgba(248, 113, 113, 0.55);
      color: #fff;
    }

    .btn-success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .btn-success:hover {
      background: rgba(34, 120, 74, 0.28);
      border-color: rgba(74, 222, 128, 0.55);
      color: #fff;
    }

    .btn-secondary {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: var(--border-hover);
    }

    /* 仪表盘统计网格 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.3rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
    }

    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .stat-header svg {
      opacity: 0.7;
    }

    .stat-value {
      font-size: 1.85rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .stat-card.alert-card {
      border-color: var(--danger-border);
    }

    .stat-card.alert-card .stat-header {
      color: var(--accent-danger);
    }

    .stat-card.alert-card .stat-value {
      color: var(--accent-danger);
    }

    /* 选项卡导航 */
    .admin-tabs {
      display: flex;
      gap: 0.6rem;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
    }

    .admin-tab {
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid transparent;
      background: transparent;
    }

    .admin-tab:hover {
      color: var(--text-main);
      background: var(--bg-surface-hover);
    }

    .admin-tab.active {
      background: rgba(125, 211, 252, 0.1);
      color: var(--accent-voice);
      border: 1px solid rgba(125, 211, 252, 0.25);
    }

    .tab-badge {
      background: rgba(248, 113, 113, 0.2);
      color: var(--accent-danger);
      font-size: 0.72rem;
      padding: 0.1rem 0.45rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    /* 内容卡片列表 */
    .post-table {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .admin-card {
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.3rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.2s ease;
    }

    .admin-card:hover {
      border-color: var(--border-hover);
    }

    .admin-card.reported {
      border-left: 3px solid var(--accent-danger);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .card-meta-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .card-meta-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .post-author {
      font-weight: 600;
      color: #fff;
      font-size: 0.95rem;
      margin-right: 0.3rem;
    }

    .meta-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .meta-tag.tag-danger {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--accent-danger);
      font-weight: 600;
    }

    .card-body {
      background: rgba(11, 15, 25, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1rem;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .card-info-footer {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .card-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      padding-top: 0.2rem;
    }

    /* 空状态提示 */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1.5rem;
      color: var(--text-muted);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .empty-icon {
      color: var(--success-text);
      opacity: 0.8;
      margin-bottom: 0.3rem;
    }

    /* 音频播放器条目 */
    audio {
      width: 100%;
      height: 36px;
      border-radius: 6px;
      outline: none;
    }

    .audio-link-bar {
      font-size: 0.75rem;
      color: var(--accent-voice);
      margin-top: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .audio-link-bar a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Toast 通知 */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-hover);
      color: #fff;
      padding: 0.65rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 通用 SVG 图标 */
    .icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .icon-lg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <div class="brand">
      <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
        <path d="M2 12h20"/>
      </svg>
      <span>WORLD ECHO</span>
      <span class="badge-admin">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        管理中枢
      </span>
    </div>
    <div id="header-user-action" style="display: none;">
      <button class="btn btn-secondary" id="btn-logout" style="font-size: 0.8rem; padding: 0.45rem 0.9rem;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        退出登录
      </button>
    </div>
  </header>

  <!-- 登录视窗 -->
  <div id="login-view" class="container">
    <div class="login-box">
      <div class="login-icon-wrap">
        <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h2>管理员登录</h2>
      <p>请输入在 Cloudflare Pages 环境变量中配置的 ADMIN_PASSWORD 访问密钥</p>
      <input type="password" id="admin-pass-input" placeholder="输入管理访问密码..." autocomplete="current-password">
      <button class="btn btn-primary" id="btn-login">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        确认登入
      </button>
    </div>
  </div>

  <!-- 管理工作区 -->
  <main id="dashboard-view" class="container" style="display: none;">
    <!-- 统计卡片网格 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <span>总回声数量</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="stat-value" id="stat-total-posts">0</div>
      </div>

      <div class="stat-card alert-card">
        <div class="stat-header">
          <span>待审 / 被举报条目</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div class="stat-value" id="stat-reported-posts">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>当前隐藏状态</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
            <line x1="2" y1="2" x2="22" y2="22"/>
          </svg>
        </div>
        <div class="stat-value" id="stat-hidden-posts">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>注册匿名身份</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="stat-value" id="stat-total-users">0</div>
      </div>
    </div>

    <!-- 标签页导航 -->
    <div class="admin-tabs">
      <div class="admin-tab active" data-tab="reported">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>违规举报处理</span>
        <span class="tab-badge" id="tab-reported-count">0</span>
      </div>
      <div class="admin-tab" data-tab="all">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span>全站留言审查</span>
      </div>
    </div>

    <!-- 列表展示区 -->
    <div id="posts-container" class="post-table">
      <div style="text-align: center; color: var(--text-muted); padding: 3rem;">加载数据中...</div>
    </div>
  </main>

  <div class="toast" id="toast-el">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="16" x2="12" y2="12"/>
      <line x1="12" y1="8" x2="12.01" y2="8"/>
    </svg>
    <span id="toast-msg">提示</span>
  </div>

  <script>
    let adminPassword = sessionStorage.getItem("we_admin_password") || "";
    let activeTab = "reported";

    function showToast(msg) {
      const toast = document.getElementById("toast-el");
      const textSpan = document.getElementById("toast-msg");
      textSpan.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    // 登录与鉴权初始化
    function checkAuth() {
      if (adminPassword) {
        document.getElementById("login-view").style.display = "none";
        document.getElementById("dashboard-view").style.display = "block";
        document.getElementById("header-user-action").style.display = "block";
        fetchAdminData();
      } else {
        document.getElementById("login-view").style.display = "block";
        document.getElementById("dashboard-view").style.display = "none";
        document.getElementById("header-user-action").style.display = "none";
      }
    }

    function doLogin() {
      const pass = document.getElementById("admin-pass-input").value.trim();
      if (!pass) return;
      adminPassword = pass;
      sessionStorage.setItem("we_admin_password", pass);
      checkAuth();
    }

    document.getElementById("btn-login").addEventListener("click", doLogin);
    document.getElementById("admin-pass-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        doLogin();
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => {
      sessionStorage.removeItem("we_admin_password");
      adminPassword = "";
      location.reload();
    });

    // 标签页切换
    document.querySelectorAll(".admin-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".admin-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeTab = tab.dataset.tab;
        fetchAdminData();
      });
    });

    // 请求管理数据
    async function fetchAdminData() {
      const container = document.getElementById("posts-container");
      container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 3rem;">正在获取管理数据...</div>`;

      const params = new URLSearchParams();
      params.append("admin", "1");
      if (activeTab === "reported") {
        params.append("reported", "1");
      }
      params.append("limit", "50");

      try {
        const res = await fetch(`/api/echo?${params.toString()}`, {
          headers: { "x-admin-password": adminPassword }
        });
        const data = await res.json();

        if (!data.success) {
          if (res.status === 401) {
            showToast("密码验证失败，请重新登入");
            sessionStorage.removeItem("we_admin_password");
            adminPassword = "";
            checkAuth();
            return;
          }
          container.innerHTML = `<div style="text-align: center; color: var(--accent-danger); padding: 3rem;">加载失败：${escapeHTML(data.error || "未知错误")}</div>`;
          return;
        }

        // 更新统计数据
        if (data.admin_stats) {
          document.getElementById("stat-total-posts").textContent = data.admin_stats.total_posts;
          document.getElementById("stat-reported-posts").textContent = data.admin_stats.reported_posts;
          document.getElementById("tab-reported-count").textContent = data.admin_stats.reported_posts;
          document.getElementById("stat-hidden-posts").textContent = data.admin_stats.hidden_posts;
          document.getElementById("stat-total-users").textContent = data.admin_stats.total_users;
        }

        renderAdminPosts(data.posts || []);
      } catch (err) {
        container.innerHTML = `<div style="text-align: center; color: var(--accent-danger); padding: 3rem;">网络连接异常，无法获取数据</div>`;
      }
    }

    function renderAdminPosts(posts) {
      const container = document.getElementById("posts-container");
      if (!posts || posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
            </div>
            <div>当前暂无待处理条目，社区一切安好</div>
          </div>
        `;
        return;
      }

      container.innerHTML = "";
      posts.forEach(post => {
        const card = document.createElement("div");
        const isReported = (post.reports_count || 0) > 0 || post.status === "hidden";
        card.className = `admin-card ${isReported ? "reported" : ""}`;

        let mediaDisplay = "";
        if (post.content_type === "voice" && post.media_url) {
          mediaDisplay = `
            <div style="margin: 0.7rem 0 0.4rem;">
              <audio controls src="${post.media_url}"></audio>
              <div class="audio-link-bar">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                <span>音频直链: <a href="${post.media_url}" target="_blank" rel="noopener noreferrer">${post.media_key || 'media'}</a></span>
              </div>
            </div>
          `;
        }

        const reportBadgeClass = post.reports_count > 0 ? "meta-tag tag-danger" : "meta-tag";

        card.innerHTML = `
          <div class="card-top">
            <div class="card-meta-left">
              <span class="post-author">#${post.id} ${escapeHTML(post.nickname)}</span>
              <span class="meta-tag">国家: ${post.country_code}</span>
              <span class="meta-tag">类型: ${post.content_type}</span>
              <span class="meta-tag">情绪: ${post.emotion}</span>
              <span class="meta-tag" style="${post.status === 'hidden' ? 'color: var(--accent-danger); font-weight: 600;' : ''}">状态: ${post.status}</span>
            </div>
            <div class="card-meta-right">
              <span class="${reportBadgeClass}">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                  <line x1="12" y1="9" x2="12" y2="13"/>
                  <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                举报: ${post.reports_count || 0}
              </span>
              <span class="meta-tag">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
                赞: ${post.likes_count || 0}
              </span>
            </div>
          </div>

          <div class="card-body">
            ${post.content ? `<div>${escapeHTML(post.content)}</div>` : ""}
            ${mediaDisplay}
            <div class="card-info-footer">
              <span>用户ID: ${escapeHTML(post.user_id)}</span>
              <span>发布时间: ${post.created_at}</span>
            </div>
          </div>

          <div class="card-actions">
            ${post.status === "hidden" || post.reports_count > 0 ? `
              <button class="btn btn-success btn-restore" data-id="${post.id}">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                忽略举报 / 恢复公开
              </button>
            ` : ""}
            ${post.status === "published" ? `
              <button class="btn btn-secondary btn-hide" data-id="${post.id}">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" y1="2" x2="22" y2="22"/>
                </svg>
                设为隐藏
              </button>
            ` : ""}
            <button class="btn btn-danger btn-dual-delete" data-id="${post.id}">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
              彻底双端删除 (GitHub + D1)
            </button>
          </div>
        `;

        // 按钮事件绑定
        const btnRestore = card.querySelector(".btn-restore");
        if (btnRestore) {
          btnRestore.addEventListener("click", () => updatePostStatus(post.id, "published", true));
        }

        const btnHide = card.querySelector(".btn-hide");
        if (btnHide) {
          btnHide.addEventListener("click", () => updatePostStatus(post.id, "hidden", false));
        }

        const btnDel = card.querySelector(".btn-dual-delete");
        if (btnDel) {
          btnDel.addEventListener("click", () => dualDeletePost(post.id));
        }

        container.appendChild(card);
      });
    }

    async function updatePostStatus(postId, status, resetReports) {
      try {
        const res = await fetch("/api/echo", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": adminPassword,
          },
          body: JSON.stringify({
            action: "admin_update_status",
            post_id: postId,
            status: status,
            reset_reports: resetReports,
          })
        });
        const d = await res.json();
        if (d.success) {
          showToast(`已成功将 #${postId} 设为 ${status}`);
          fetchAdminData();
        } else {
          showToast(d.error || "操作失败");
        }
      } catch (e) {
        showToast("请求发生异常");
      }
    }

    async function dualDeletePost(postId) {
      if (!confirm(`确定彻底双端销毁 #${postId}？\n若包含语音，将调用 GitHub API 物理删除音频文件，并彻底清理 D1 数据库记录。`)) {
        return;
      }

      try {
        const res = await fetch(`/api/echo?id=${postId}`, {
          method: "DELETE",
          headers: { "x-admin-password": adminPassword }
        });
        const d = await res.json();
        if (d.success) {
          showToast("已成功执行双端彻底删除");
          fetchAdminData();
        } else {
          showToast(d.error || "删除失败");
        }
      } catch (e) {
        showToast("网络请求发生异常");
      }
    }

    function escapeHTML(str) {
      if (!str) return "";
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.addEventListener("DOMContentLoaded", checkAuth);
  </script>
</body>
</html>
